<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDFold</title>
<link rel="icon" href="PDFold.svg" type="image/svg+xml">
<script>
  // set theme before first paint to avoid flashing
  (() => {
    let t = null;
    try { t = localStorage.getItem('theme'); } catch {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.bsTheme = t;
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="vendor/overlayscrollbars.css">
<style>
  :root {
    --brand: #8e2435; --brand-hover: #7a1e2d; --brand-active: #661826;
    --bar: linear-gradient(135deg, #3a4656 0%, #2c3542 55%, #232b36 100%);
  }
  /* fixed layout: only the document list scrolls */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #scroller { flex: 1; min-height: 0; margin: 0 -.75rem; padding: 0 .75rem; }
  .titlebar { flex-shrink: 0; }
  .titlebar {
    background: var(--bar); color: #fff;
    position: relative; z-index: 10;
    box-shadow: 0 2px 4px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.14), 0 16px 32px rgba(0,0,0,.10);
  }
  .about { box-shadow: 0 1rem 3rem rgba(0,0,0,.3); }
  .about-head { background: var(--bar); }
  .logo { width: 1.75rem; height: 1.75rem; vertical-align: -.4rem; margin-right: .2rem; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .about-head .logo { width: 4rem; height: 4rem; margin: 0; }
  .about dt { font-weight: 500; color: var(--bs-secondary-color); }
  .actionbar {
    flex-shrink: 0;
    border: 1px solid var(--bs-border-color-translucent);
    box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.10);
  }
  .min-w-0 { min-width: 0; }
  .btn-icon { width: 2.5rem; height: 2.5rem; padding: 0; color: var(--bs-secondary-color); border: 0; }
  .btn-icon:hover { color: var(--bs-danger); background: var(--bs-danger-bg-subtle); }
  .btn-pdf {
    --bs-btn-bg: var(--brand); --bs-btn-border-color: var(--brand); --bs-btn-color: #fff;
    --bs-btn-hover-bg: var(--brand-hover); --bs-btn-hover-border-color: var(--brand-hover); --bs-btn-hover-color: #fff;
    --bs-btn-active-bg: var(--brand-active); --bs-btn-active-border-color: var(--brand-active); --bs-btn-active-color: #fff;
    --bs-btn-disabled-bg: var(--brand); --bs-btn-disabled-border-color: var(--brand); --bs-btn-disabled-color: #fff;
    height: 2.5rem; font-weight: 500;
    box-shadow: 0 4px 12px rgba(142,36,53,.30);
  }
  #drop { border: 2px dashed var(--bs-border-color); cursor: pointer; transition: .15s; }
  #drop.over { border-color: var(--bs-primary); color: var(--bs-primary) !important; background: var(--bs-primary-bg-subtle); }
  .doc { cursor: grab; user-select: none; }
  .sort-ghost { opacity: .35; }
  .sort-drag { opacity: 1 !important; border-radius: var(--bs-border-radius); box-shadow: 0 .75rem 2rem rgba(0,0,0,.25); cursor: grabbing; }
  .handle { color: var(--bs-secondary-color); font-size: 1.25rem; }
  .thumb { width: 72px; aspect-ratio: 1 / 1.414; background: #fff; flex-shrink: 0; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .name { word-break: break-all; }
  .btn-ghost { color: var(--bs-secondary-color); border: 0; }
  .btn-ghost:hover { color: var(--bs-body-color); background: var(--bs-secondary-bg); }
  .btn-soft { --bs-btn-color: var(--bs-body-color); --bs-btn-bg: var(--bs-body-bg); --bs-btn-border-color: var(--bs-border-color);
    --bs-btn-hover-bg: var(--bs-secondary-bg); --bs-btn-hover-border-color: var(--bs-border-color); height: 2.5rem; }

  /* half-page grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; padding: 4px 0 8px; }
  .half {
    position: relative; aspect-ratio: 210 / 148.5; overflow: hidden; cursor: zoom-in; user-select: none;
    background: #fff; border-radius: .5rem; border: 2px solid var(--brand);
    box-shadow: 0 2px 6px rgba(0,0,0,.10), 0 6px 16px rgba(0,0,0,.08);
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .half:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.14), 0 10px 24px rgba(0,0,0,.10); }
  .half img { width: 100%; display: block; pointer-events: none; transition: opacity .15s, filter .15s; }
  .half img.bottom { transform: translateY(-50%); }
  .half .tag { position: absolute; font-size: .7rem; font-weight: 500; padding: .15rem .45rem; border-radius: 1rem; }
  .half .src { bottom: 6px; right: 6px; background: rgba(0,0,0,.6); color: #fff; }
  .half .out { bottom: 6px; left: 6px; background: var(--brand); color: #fff; }
  .half .tog {
    position: absolute; top: 6px; right: 6px; z-index: 2; height: 2rem; min-width: 2rem; padding: 0 .55rem;
    display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
    border: 0; border-radius: 1rem; font-size: .8rem; font-weight: 500; cursor: pointer;
    background: rgba(0,0,0,.55); color: #fff; transition: background .15s, transform .15s;
  }
  .half .tog:hover { background: var(--bs-danger); transform: scale(1.06); }
  .half.off .tog { background: var(--brand); box-shadow: 0 2px 6px rgba(142,36,53,.35); }
  .half.off .tog:hover { background: var(--brand-hover); }
  .half .off-mark {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: .35rem; pointer-events: none;
    color: #6c757d; font-weight: 500; font-size: .9rem;
  }
  .half.off { border: 2px dashed var(--bs-border-color); box-shadow: none; background: #f4f4f4; }
  .half.off img { opacity: .18; filter: grayscale(1); }
  .half.off .off-mark { display: flex; }
  .half.off .out { display: none; }
  #halfBar { flex-shrink: 0; }
  #grid.hide-off .half.off { display: none; }
  #halfBar .form-check-input { cursor: pointer; }
  #halfBar .form-check-input:checked { background-color: var(--brand); border-color: var(--brand); }
  #halfBar .form-check-input:focus { box-shadow: 0 0 0 .2rem rgba(142,36,53,.25); border-color: var(--brand); }

  .pv-dialog { max-width: none; width: fit-content; margin: 0 auto; }
  .pv-content { background: transparent; border: 0; box-shadow: none; align-items: center; cursor: zoom-out; }
  .pv-img {
    max-width: 80vw; max-height: 80vh;
    background: #fff; border-radius: .375rem;
    box-shadow: 0 .75rem 2rem rgba(0,0,0,.35), 0 2rem 4rem rgba(0,0,0,.25);
  }
</style>
</head>
<body class="bg-body-tertiary">
<header class="titlebar">
  <div class="container d-flex align-items-center gap-2 py-3" style="max-width: 760px">
    <h1 class="h5 mb-0 me-auto fw-semibold"><img src="PDFold.svg" class="logo" alt=""> PDFold</h1>
    <button class="btn btn-sm btn-outline-light border-0" data-bs-toggle="modal" data-bs-target="#about" title="Über PDFold" aria-label="Über PDFold">
      <i class="bi bi-info-circle"></i>
    </button>
    <button id="theme" class="btn btn-sm btn-outline-light border-0" title="Hell / Dunkel">
      <i class="bi"></i>
    </button>
  </div>
</header>

<main class="container pt-4 pb-3" style="max-width: 760px">

  <div id="drop" class="rounded-3 p-4 text-center text-body-secondary bg-body mb-3">
    <i class="bi bi-cloud-arrow-up fs-2 d-block mb-1"></i>
    PDFs hierher ziehen oder klicken
  </div>
  <div id="halfBar" class="d-none flex-wrap align-items-center gap-2 mb-3 p-2 bg-body rounded-3 border">
    <button id="halfBack" class="btn btn-sm btn-ghost rounded-pill text-nowrap me-auto" title="Zurück zur Dokumentliste">
      <i class="bi bi-arrow-left"></i> Dokumente</button>
    <div class="form-check form-switch mb-0 me-1 small text-nowrap" title="Abgewählte Halbseiten ausblenden">
      <input class="form-check-input" type="checkbox" role="switch" id="hideOff">
      <label class="form-check-label" for="hideOff">Entfallene ausblenden <span id="offCount" class="text-body-secondary"></span></label>
    </div>
    <button id="halfDropBlank" class="btn btn-sm btn-ghost rounded-pill text-nowrap" title="Als leer erkannte Halbseiten abwählen">
      <i class="bi bi-magic"></i> Leere abwählen</button>
    <button id="halfAll" class="btn btn-sm btn-ghost rounded-pill text-nowrap" title="Alle Halbseiten wählen">
      <i class="bi bi-check2-all"></i> Alle wählen</button>
  </div>
  <input type="file" id="picker" accept="application/pdf,.pdf" multiple hidden>

  <div id="status" class="small text-body-secondary mb-2" style="min-height: 1.5em"></div>

  <div id="scroller">
    <ul id="list" class="list-group my-1"></ul>
    <div id="grid" class="d-none"></div>
  </div>

  <div id="actions" class="actionbar d-flex align-items-center gap-3 mt-3 p-2 ps-3 bg-body rounded-4 d-none">
    <div class="me-auto lh-sm min-w-0">
      <div class="fw-semibold text-truncate" id="sumMain"></div>
      <div class="small text-body-secondary text-truncate" id="sumSub"></div>
    </div>
    <button id="clear" class="btn btn-icon rounded-circle" title="Alle entfernen" aria-label="Alle entfernen">
      <i class="bi bi-trash3"></i>
    </button>
    <button id="halfStart" class="btn btn-soft rounded-pill px-3 text-nowrap" title="A4-Seiten in A5-Hälften teilen und neu bündeln">
      <i class="bi bi-layout-split"></i><span class="d-none d-sm-inline"> Halbseiten</span>
    </button>
    <button id="halfBuild" class="btn btn-pdf rounded-pill px-4 text-nowrap d-none">
      <i class="bi bi-file-earmark-arrow-down"></i> PDF erstellen
    </button>
    <button id="merge" class="btn btn-pdf rounded-pill px-4 text-nowrap">
      <i class="bi bi-file-earmark-arrow-down"></i> Zusammenfügen
    </button>
  </div>
</main>

<div class="modal fade" id="about" tabindex="-1" aria-labelledby="aboutTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 rounded-4 overflow-hidden about">
      <div class="about-head text-center text-white py-4">
        <img src="PDFold.svg" class="logo" alt="">
        <h2 class="h4 mt-2 mb-0" id="aboutTitle">PDFold</h2>
        <span class="badge rounded-pill bg-white text-dark mt-2" id="aboutVersion">v…</span>
      </div>
      <div class="modal-body px-4">
        <p class="small text-body-secondary text-center" id="aboutDesc"></p>
        <dl class="row small mb-0" id="aboutTech"></dl>
      </div>
      <div class="modal-footer border-0 pt-0 justify-content-center">
        <button type="button" class="btn btn-pdf rounded-pill px-4" data-bs-dismiss="modal">Schließen</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="preview" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered pv-dialog">
    <div class="modal-content pv-content" data-bs-dismiss="modal" title="Klicken zum Schließen">
      <div id="previewSpin" class="spinner-border text-light" role="status"></div>
      <img id="previewImg" class="pv-img d-none" alt="Erste Seite">
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="vendor/overlayscrollbars.js"></script>
<script src="vendor/sortable.js"></script>

<script>
const $ = (s) => document.querySelector(s);
const list = $('#list'), drop = $('#drop'), status = $('#status');
let items = [];       // { id, name, pages, bytes, ... } in display order
let pending = 0;

// --- theme toggle ---
const osTheme = (t) => (t === 'dark' ? 'os-theme-light' : 'os-theme-dark');
const scroller = OverlayScrollbarsGlobal.OverlayScrollbars($('#scroller'), {
  scrollbars: { autoHide: 'leave', autoHideDelay: 600, theme: osTheme(document.documentElement.dataset.bsTheme) },
});
function applyTheme(t) {
  document.documentElement.dataset.bsTheme = t;
  $('#theme i').className = 'bi ' + (t === 'dark' ? 'bi-sun' : 'bi-moon-stars');
  scroller.options({ scrollbars: { theme: osTheme(t) } });
}
applyTheme(document.documentElement.dataset.bsTheme);
$('#theme').onclick = () => {
  const t = document.documentElement.dataset.bsTheme === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('theme', t); } catch {}
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmtBytes = (n) => n < 1024 * 1024 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
function say(msg, err = false) {
  status.textContent = msg;
  status.className = 'small mb-2 ' + (err ? 'text-danger' : 'text-body-secondary');
  status.dataset.err = err ? '1' : '';
}

function render() {
  list.innerHTML = '';
  items.forEach((it, i) => {
    const li = document.createElement('li');
    li.className = 'list-group-item doc d-flex align-items-center gap-3 py-2';
    li.dataset.id = it.id;
    const meta = [
      `${it.pages} ${it.pages === 1 ? 'Seite' : 'Seiten'}`,
      fmtBytes(it.bytes),
      it.pageSize && (it.pageSize.match(/\(([^)]+)\)/)?.[1] || it.pageSize),
      it.version && 'PDF ' + it.version,
    ].filter(Boolean).map(esc).join(' · ');
    li.innerHTML = `
      <i class="bi bi-grip-vertical handle"></i>
      <span class="badge rounded-pill text-bg-secondary">${i + 1}</span>
      <div class="thumb border rounded"><img src="api/thumb/${it.id}?v=${it.rev || 0}" alt=""></div>
      <div class="flex-grow-1 min-w-0">
        <div class="name fw-medium">${esc(it.name)}</div>
        ${it.title ? `<div class="small text-body-secondary">${esc(it.title)}</div>` : ''}
        <div class="small text-body-secondary">${meta}
          ${it.encrypted ? '<span class="badge text-bg-warning ms-1">verschlüsselt</span>' : ''}
          ${it.autoRotated ? `<span class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis ms-1" title="Querformat-Seiten wurden hochkant gedreht"><i class="bi bi-arrow-clockwise"></i> ${it.autoRotated} gedreht</span>` : ''}</div>
      </div>
      <button class="btn btn-sm btn-ghost rounded-circle rot" title="Um 90° drehen"><i class="bi bi-arrow-clockwise"></i></button>
      <button class="btn btn-sm btn-outline-danger border-0 rounded-circle del" title="Entfernen"><i class="bi bi-x-lg"></i></button>`;
    li.querySelector('.del').onclick = (e) => { e.stopPropagation(); remove(it.id); };
    li.querySelector('.rot').onclick = (e) => { e.stopPropagation(); rotateDoc(it, e.currentTarget); };
    li.onclick = () => showImage(`api/preview/${it.id}?v=${it.rev || 0}`, 'Erste Seite: ' + it.name);
    li.title = 'Klicken für große Vorschau';
    list.appendChild(li);
  });
  const total = items.reduce((s, it) => s + it.pages, 0);
  const bytes = items.reduce((s, it) => s + it.bytes, 0);
  $('#actions').classList.toggle('d-none', !items.length);
  $('#sumMain').textContent = `${items.length} ${items.length === 1 ? 'Dokument' : 'Dokumente'}`;
  $('#sumSub').textContent = `${total} ${total === 1 ? 'Seite' : 'Seiten'} · ${fmtBytes(bytes)}`;
  $('#merge').disabled = $('#halfStart').disabled = !items.length || pending > 0;
  if (!pending && !status.dataset.err)
    say(items.length > 1 ? 'Reihenfolge per Drag & Drop ändern · Klick zeigt die erste Seite groß' : '');
}

async function upload(files) {
  const pdfs = [...files].filter((f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (!pdfs.length) return say('Nur PDF-Dateien werden unterstützt.', true);
  pending += pdfs.length;
  say(`Lade ${pending} Datei(en) hoch …`);
  render();
  // upload in parallel but keep drop order
  const results = await Promise.all(pdfs.map(async (f) => {
    try {
      const r = await fetch('api/upload', { method: 'POST', body: f, headers: { 'X-Filename': encodeURIComponent(f.name) } });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      return d;
    } catch (e) { return { error: e.message || f.name }; }
    finally { pending--; }
  }));
  const errors = results.filter((r) => r.error).map((r) => r.error);
  items.push(...results.filter((r) => !r.error));
  say('');
  if (errors.length) say(errors.join(' · '), true);
  render();
}

// download name: first document's name + suffix
const outName = () => (items[0]?.name || 'dokument').replace(/\.pdf$/i, '') + '_zusammengefuegt.pdf';

// --- about dialog ---
$('#about').addEventListener('show.bs.modal', async () => {
  try {
    const a = await (await fetch('api/about')).json();
    $('#aboutVersion').textContent = 'Version ' + a.version;
    $('#aboutDesc').textContent = a.description;
    $('#aboutTech').innerHTML = [['qpdf', a.qpdf], ['Poppler', a.poppler], ['Node.js', a.node]]
      .filter(([, v]) => v)
      .map(([k, v]) => `<dt class="col-6">${k}</dt><dd class="col-6 mb-1 text-end font-monospace">${esc(v)}</dd>`)
      .join('');
  } catch {
    $('#aboutVersion').textContent = 'Version unbekannt';
  }
}, { once: false });

// --- large preview ---
function showImage(src, alt) {
  const img = $('#previewImg'), spin = $('#previewSpin');
  img.alt = alt;
  img.classList.add('d-none');
  spin.classList.remove('d-none');
  img.onload = () => { spin.classList.add('d-none'); img.classList.remove('d-none'); };
  img.onerror = () => { spin.classList.add('d-none'); };
  img.removeAttribute('src');
  img.src = src;
  bootstrap.Modal.getOrCreateInstance('#preview').show();
}

async function rotateDoc(it, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
  try {
    const r = await fetch('api/rotate/' + it.id, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ angle: 90 }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    Object.assign(it, d, { rev: (it.rev || 0) + 1 });
  } catch (e) { say('Drehen fehlgeschlagen: ' + e.message, true); }
  render();
}

// ---------- A5 half-page mode ----------
let half = null;   // { sid, list: [{ page, pos, blank, ink, keep }] } in display order
const grid = $('#grid');

function setMode(m) {
  const halves = m === 'halves';
  $('#drop').classList.toggle('d-none', halves);
  $('#halfBar').classList.toggle('d-none', !halves);
  $('#halfBar').classList.toggle('d-flex', halves);
  list.classList.toggle('d-none', halves);
  grid.classList.toggle('d-none', !halves);
  for (const id of ['#clear', '#halfStart', '#merge']) $(id).classList.toggle('d-none', halves);
  $('#halfBuild').classList.toggle('d-none', !halves);
  scroller.elements().viewport.scrollTop = 0;
  say('');
  halves ? renderGrid() : render();
}

function renderGrid() {
  let k = 0;
  grid.innerHTML = half.list.map((h, i) => {
    const out = h.keep ? k++ : -1;
    return `<div class="half${h.keep ? '' : ' off'}" data-i="${i}" title="Klick: vergrößern">
      <img class="${h.pos}" src="api/halves/${half.sid}/tile/${h.page}" alt="">
      <span class="tag src">S. ${h.page} ${h.pos === 'top' ? 'oben' : 'unten'}</span>
      ${out >= 0 ? `<span class="tag out">→ Seite ${Math.floor(out / 2) + 1} ${out % 2 ? 'unten' : 'oben'}</span>` : ''}
      ${h.keep
        ? '<button class="tog" title="Halbseite entfernen" aria-label="Halbseite entfernen"><i class="bi bi-x-lg"></i></button>'
        : '<button class="tog" title="Halbseite wieder aufnehmen"><i class="bi bi-arrow-counterclockwise"></i> aufnehmen</button>'}
      <div class="off-mark"><i class="bi bi-x-circle"></i> entfällt</div>
    </div>`;
  }).join('');
  const kept = half.list.filter((h) => h.keep).length;
  const sheets = Math.ceil(kept / 2);
  const hideOff = $('#hideOff').checked;
  grid.classList.toggle('hide-off', hideOff);
  $('#offCount').textContent = `(${half.list.length - kept})`;
  $('#sumMain').textContent = `${kept} von ${half.list.length} Halbseiten`;
  $('#sumSub').textContent = `ergibt ${sheets} ${sheets === 1 ? 'Seite' : 'Seiten'} A4`;
  $('#halfBuild').disabled = !kept;
  if (!status.dataset.err) say(hideOff && !kept
    ? 'Alle Halbseiten sind abgewählt – Schalter aus oder „Alle wählen“'
    : 'Klick vergrößert · × entfernt, ↺ nimmt wieder auf · Ziehen ändert die Reihenfolge');
}

grid.addEventListener('click', (e) => {
  const tile = e.target.closest('.half');
  if (!tile) return;
  const h = half.list[tile.dataset.i];
  if (e.target.closest('.tog')) {
    h.keep = !h.keep;
    return renderGrid();
  }
  showImage(`api/halves/${half.sid}/half/${h.page}/${h.pos}`, `Seite ${h.page} ${h.pos === 'top' ? 'oben' : 'unten'}`);
});

$('#halfStart').onclick = async () => {
  const btn = $('#halfStart'), label = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Analysiere …';
  say('Teile Seiten und suche leere Halbseiten …');
  try {
    const r = await fetch('api/halves/prepare', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: items.map((it) => it.id) }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    half = { sid: d.sid, list: d.halves.map((h) => ({ ...h, keep: !h.blank })) };
    setMode('halves');
  } catch (e) {
    say('Fehler: ' + e.message, true);
  } finally { btn.innerHTML = label; btn.disabled = !items.length; }
};

$('#halfBack').onclick = () => {
  if (half) fetch('api/halves/' + half.sid, { method: 'DELETE' });
  half = null;
  setMode('docs');
};
try { $('#hideOff').checked = localStorage.getItem('hideOff') === '1'; } catch {}
$('#hideOff').onchange = (e) => {
  try { localStorage.setItem('hideOff', e.target.checked ? '1' : '0'); } catch {}
  renderGrid();
};
$('#halfDropBlank').onclick = () => { half.list.forEach((h) => { if (h.blank) h.keep = false; }); renderGrid(); };
$('#halfAll').onclick = () => { half.list.forEach((h) => { h.keep = true; }); renderGrid(); };

$('#halfBuild').onclick = async () => {
  const btn = $('#halfBuild'), label = btn.innerHTML;
  const name = (items[0]?.name || 'dokument').replace(/\.pdf$/i, '') + '_halbseiten.pdf';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Erstelle …';
  try {
    const r = await fetch(`api/halves/${half.sid}/build`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, halves: half.list.filter((h) => h.keep).map(({ page, pos }) => ({ page, pos })) }),
    });
    if (!r.ok) throw new Error((await r.json()).error);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob());
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    say('');
    renderGrid();
  } catch (e) {
    say('Fehler: ' + e.message, true);
  } finally { btn.innerHTML = label; btn.disabled = !half?.list.some((h) => h.keep); }
};

function remove(id) {
  items = items.filter((it) => it.id !== id);
  fetch('api/file/' + id, { method: 'DELETE' });
  say('');
  render();
}

$('#clear').onclick = () => {
  items.forEach((it) => fetch('api/file/' + it.id, { method: 'DELETE' }));
  items = [];
  say('');
  render();
};

$('#merge').onclick = async () => {
  const btn = $('#merge');
  const label = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Füge zusammen …';
  try {
    const r = await fetch('api/merge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: items.map((it) => it.id), name: outName() }),
    });
    if (!r.ok) throw new Error((await r.json()).error);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = outName();
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    say('');
    render();
  } catch (e) {
    say('Fehler: ' + e.message, true);
  } finally { btn.innerHTML = label; btn.disabled = !items.length; }
};

// --- file drop zone ---
drop.onclick = () => $('#picker').click();
$('#picker').onchange = (e) => { upload(e.target.files); e.target.value = ''; };
const isFileDrag = (e) => [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragover', (e) => { if (isFileDrag(e)) { e.preventDefault(); drop.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) drop.classList.remove('over'); });
document.addEventListener('drop', (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  drop.classList.remove('over');
  if (half) return say('Zum Hinzufügen erst zurück zu „Dokumente“.', true);
  upload(e.dataTransfer.files);
});

// --- reorder via SortableJS ---
Sortable.create(list, {
  animation: 180,
  easing: 'cubic-bezier(.2, .8, .2, 1)',
  forceFallback: true,            // pointer-based dragging, independent of native HTML5 DnD
  fallbackTolerance: 4,           // small movement threshold so clicks still open the preview
  ghostClass: 'sort-ghost',
  chosenClass: 'sort-chosen',
  fallbackClass: 'sort-drag',
  scroll: scroller.elements().viewport,
  scrollSensitivity: 60,
  onEnd: (e) => {
    if (e.oldIndex === e.newIndex) return;
    const [moved] = items.splice(e.oldIndex, 1);
    items.splice(e.newIndex, 0, moved);
    render();
  },
});
Sortable.create(grid, {
  animation: 180,
  easing: 'cubic-bezier(.2, .8, .2, 1)',
  forceFallback: true,
  fallbackTolerance: 4,
  ghostClass: 'sort-ghost',
  fallbackClass: 'sort-drag',
  scroll: scroller.elements().viewport,
  scrollSensitivity: 60,
  onEnd: () => {
    // rebuild order from the DOM so hidden ("entfallene") tiles keep their place
    half.list = [...grid.children].map((el) => half.list[el.dataset.i]);
    renderGrid();
  },
});
</script>
</body>
</html>
